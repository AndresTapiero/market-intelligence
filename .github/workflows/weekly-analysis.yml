name: Análisis mensual

on:
  schedule:
    # Día 26 de cada mes, 12:00 UTC = 07:00 Colombia (UTC-5)
    - cron: '0 12 26 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Configurar identidad Git
        run: |
          git config user.name  "Market Intelligence Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Dry-run (validar secrets y conexiones)
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PORTFOLIO_USER_ID:   ${{ secrets.PORTFOLIO_USER_ID }}
        run: node test-dry-run.js

      - name: Ejecutar análisis mensual
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PORTFOLIO_USER_ID:   ${{ secrets.PORTFOLIO_USER_ID }}
        run: node analyze.js
